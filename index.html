<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Engine</title>

    <style>
        body
        {
            background-color: black;
            color: rgb(231, 231, 231);

            padding: 50px;
            text-align: center;
        }

        img{
            width: 256px;
            height: 256px;
        }
        h1{
            font-size: 48px;
        }
        h3
        {
            font-size: 24px;
            color: rgb(161, 161, 161);
        }

        .img-btn {
            background-color: rgb(219, 219, 219);
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;

            margin-left: 64px;
        }
        .img-btn:hover {
            background-color: rgb(158, 158, 158);
        }

        .img-btn img {
            width: 64px;
            height: 64px;
        }

        .logo
        {
            width: 64px;
            height: 64px;

            display: flex;
        }

    </style>

    <link rel="icon" href="herb fill.png" type="image/png">
</head>
<body>
    <img class="logo" src="DarkMaster Logo.png">
    <img src="herb fill.png">
    <h1>Garden Engine</h1>
    
    <button class="img-btn" onclick="Windows10()">
        <img src="windows-10-icon.png" alt="button">
    </button>
    <button class="img-btn" onclick="Linux()">
        <img src="linux.png" alt="button">
    </button>

    <h3>..قريبا سيتوفر اصدار تجريبي</h3>
    
    <br><br>

    <script>
        function Windows10()
        {
            alert("قريبا جدا سيتوفر على نضام Windows 10/11")
        }
        function Linux()
        {
            alert("قريبا سيتوفر على نضام linux")
        }
    </script>
